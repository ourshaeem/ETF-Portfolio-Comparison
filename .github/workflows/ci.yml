# Runs on every push / PR: Python unit tests, a pipeline smoke test against a real
# Postgres (live API pull with a small simulation), and a production build of the web app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etf
          POSTGRES_PASSWORD: etf
          POSTGRES_DB: etf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etf" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke test (live APIs, 1,000 paths)
        # Yahoo sometimes rate-limits GitHub-hosted runners; report, don't block.
        continue-on-error: true
        env:
          POSTGRES_HOST: localhost
          MC_PATHS: "1000"
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python -m etf_pipeline run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
